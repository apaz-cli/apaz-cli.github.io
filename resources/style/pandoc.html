<style type="text/css">
/* https://github.com/markdowncss/retro/blob/master/css/retro.css */

@font-face {
    font-family: "lemon";
    src: url('lemon.woff');
}

/*
@media print {
    *, *:before, *:after {
        background: transparent !important;
        color: #000 !important;
        box-shadow: none !important;
        text-shadow: none !important;
    }
    a, a:visited { text-decoration: underline; }
    a[href]:after { content: " (" attr(href) ")"; }
    abbr[title]:after { content: " (" attr(title) ")"; }
    a[href^="#"]:after, a[href^="javascript:"]:after { content: ""; }
    pre, blockquote { border: 1px solid #999; page-break-inside: avoid; }
    thead { display: table-header-group; }
    tr, img { page-break-inside: avoid; }
    img { max-width: 100% !important; }
    p, h2, h3 { orphans: 3; widows: 3; }
    h2, h3 { page-break-after: avoid; }
}
*/
a, a:visited { color: #01ff70; }
a:hover, a:focus, a:active { color: #2ecc40; }
.retro-no-decoration { text-decoration: none; }
p, .retro-p {
    font-size: 1rem;
    margin-bottom: 1.3rem;
    /*text-indent: 50px*/
}
h1, .retro-h1, h2, .retro-h2, h3, .retro-h3, h4, .retro-h4 {
    font-family: "lemon";
    margin: 1.414rem 0 .5rem;
    font-weight: inherit;
    line-height: 1.42;
}
html h1, html .retro-h1 {
    color: rgb(112, 221, 0);
    margin-top: 0;
    font-size: 400%;
}
html h2, html .retro-h2 {
    color: rgb(112, 221, 0);
    margin-top: 0;
    font-size: 283%;
}
html h3, html .retro-h3 {
    font-size: 200%;
}
html h4, html .retro-h4 {
    font-size: 141%;
}
html h5, html .retro-h5 {
    font-size: 112%;
}
html h6, html .retro-h6 {
    font-size: 88%;
}
small, .retro-small {
    font-size: .707em;
}

img, canvas, iframe, video, svg, select, textarea { max-width: 100%; }

html, body {
    /* background-image: url(https://raw.githubusercontent.com/apaz-cli/apaz-cli.github.io/master/pattern.png); */
    background-color: #222;
    min-height: 100%;
    font-size: 20px;
}
body {
    color: #fafafa;
    /* font-family:  "lemon", "Courier New"; */
    line-height: 1.65;
    max-width: 48rem;
    /* margin: 6rem auto 1rem; */
    /* padding: .25rem; */
}
pre, code {
    background-color: #333;
    font-family: "lemon", "Menlo", "Monaco", "Courier New";
    font-size: 12;
}

#font-toggle { display: none; }
/* The label is anchored to .code-wrap, which does NOT scroll, while the
   scroll container (div.sourceCode/pre) inside it does — so the "font"
   button stays fixed in the corner as the code scrolls behind it. */
.code-wrap { position: relative; }
.code-wrap > label {
    position: absolute;
    top: 0.3rem;
    right: 0.3rem;
    cursor: pointer;
    color: #666;
    padding: 0.1em 0.4em;
    border: 1px solid #555;
    font-family: "lemon", "Menlo", "Monaco", "Courier New";
    font-size: 10px;
    user-select: none;
    z-index: 1;
    background: #2a2a2a;
    line-height: 1.4;
}
html:has(#font-toggle:checked) .code-wrap > label {
    font-family: "Menlo", "Monaco", "Courier New", monospace;
}
html:has(#font-toggle:checked) pre,
html:has(#font-toggle:checked) code {
    font-family: "Menlo", "Monaco", "Courier New", monospace;
}

code span.dt { color: #e4a51e; } /* DataType */

pre {
    padding: 0;
    line-height: 1.25;
    overflow-x: visible;
    background-color: transparent;
}

pre code {
    display: block;
    min-width: max-content;
    padding: .5rem;
    background-color: #333;
}
blockquote {
    border-left: 3px solid #01ff70;
    padding-left: 1rem;
}

/* More dramatic mobile scaling */
@media (max-width: 600px) {
    html h1, html .retro-h1 {
        font-size: 250%;
    }
    html h2, html .retro-h2 {
        font-size: 180%;
    }
    html h3, html .retro-h3 {
        font-size: 140%;
    }
    html h4, html .retro-h4 {
        font-size: 110%;
    }
}
</style>
