<style type="text/css">
/* https://github.com/markdowncss/retro/blob/master/css/retro.css */

@font-face {
    font-family: "lemon";
    src: url('lemon.woff');
}

/*
@media print {
    *, *:before, *:after {
        background: transparent !important;
        color: #000 !important;
        box-shadow: none !important;
        text-shadow: none !important;
    }
    a, a:visited { text-decoration: underline; }
    a[href]:after { content: " (" attr(href) ")"; }
    abbr[title]:after { content: " (" attr(title) ")"; }
    a[href^="#"]:after, a[href^="javascript:"]:after { content: ""; }
    pre, blockquote { border: 1px solid #999; page-break-inside: avoid; }
    thead { display: table-header-group; }
    tr, img { page-break-inside: avoid; }
    img { max-width: 100% !important; }
    p, h2, h3 { orphans: 3; widows: 3; }
    h2, h3 { page-break-after: avoid; }
}
*/
a, a:visited { color: #01ff70; }
a:hover, a:focus, a:active { color: #2ecc40; }
.retro-no-decoration { text-decoration: none; }
p, .retro-p {
    font-size: 1rem;
    margin-bottom: 1.3rem;
    /*text-indent: 50px*/
}
h1, .retro-h1, h2, .retro-h2, h3, .retro-h3, h4, .retro-h4 {
    font-family: "lemon";
    margin: 1.414rem 0 .5rem;
    font-weight: inherit;
    line-height: 1.42;
}
html h1, html .retro-h1 {
    color: rgb(112, 221, 0);
    margin-top: 0;
    font-size: 400%;
}
html h2, html .retro-h2 {
    color: rgb(112, 221, 0);
    margin-top: 0;
    font-size: 283%;
}
html h3, html .retro-h3 {
    font-size: 200%;
}
html h4, html .retro-h4 {
    font-size: 141%;
}
html h5, html .retro-h5 {
    font-size: 112%;
}
html h6, html .retro-h6 {
    font-size: 88%;
}
small, .retro-small {
    font-size: .707em;
}

img, canvas, iframe, video, svg, select, textarea { max-width: 100%; }

html, body {
    /* background-image: url(https://raw.githubusercontent.com/apaz-cli/apaz-cli.github.io/master/pattern.png); */
    background-color: #222;
    min-height: 100%;
    font-size: 20px;
}
body {
    color: #fafafa;
    /* font-family:  "lemon", "Courier New"; */
    line-height: 1.65;
    max-width: 48rem;
    /* margin: 6rem auto 1rem; */
    /* padding: .25rem; */
}
pre, code {
    background-color: #333;
    font-family: "lemon", "Menlo", "Monaco", "Courier New";
    font-size: 20px; /* Inline code: lemon's native (1:1) size. Blocks are set below. */
}

/* Pandoc's default table borders are #1a1a1a, invisible on the dark background. */
table {
    border-collapse: collapse;
    margin: 1.5em 0;
}
th, td {
    border: 1px solid #555;
    padding: 0.35em 0.75em;
    text-align: left;
    vertical-align: top;
}
th {
    background-color: #333;
    color: rgb(112, 221, 0);
}
tbody tr:nth-child(even) {
    background-color: #2a2a2a;
}
td code, th code {
    background-color: transparent;
}

/* ::: {.algo} in markdown: pseudocode and its terms table side by side.
   Breaks out of the body's max-width; stacks on narrow screens. */
.algo {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5em;
    align-items: flex-start;
    width: min(96vw, 110rem);
    position: relative;
    left: 50%;
    transform: translateX(-50%);
}
.algo > * {
    flex: 1 1 28rem;
    min-width: 0;
    margin: 0;
}
.algo > div.sourceCode {
    flex: 1.4 1 40rem;
}
.algo table {
    font-size: 85%;
    line-height: 1.35;
}

#font-toggle { display: none; }
/* The buttons are anchored to .code-wrap, which does NOT scroll, while the
   scroll container (div.sourceCode/pre) inside it does — so the "font" and
   "fit" buttons stay fixed in the corner as the code scrolls behind them. */
.code-wrap { position: relative; }
/* Slight fade on the right edge, hinting that long lines scroll. Sits in the
   non-scrolling .code-wrap so it stays put; fades into the block's own background.
   .overflows is set by the script below. */
.code-wrap.overflows::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 12px;
    pointer-events: none;
    background: linear-gradient(to right, rgba(51, 51, 51, 0), #333);
}
.code-buttons {
    position: absolute;
    top: 0.3rem;
    right: 0.3rem;
    z-index: 1;
    display: flex;
    gap: 0.3rem;
}
.code-buttons > * {
    cursor: pointer;
    color: #666;
    padding: 0.1em 0.4em;
    border: 1px solid #555;
    font-family: "lemon", "Menlo", "Monaco", "Courier New";
    font-size: 10px;
    user-select: none;
    background: #2a2a2a;
    line-height: 1.4;
    margin: 0;
}
/* "fit" only appears while there's something to fit, or something to undo. */
.code-wrap:not(.overflows):not(.fitted) .fit-btn { display: none; }
.code-wrap.fitted .fit-btn { color: #01ff70; border-color: #01ff70; }
html:has(#font-toggle:checked) .code-buttons > * {
    font-family: "Menlo", "Monaco", "Courier New", monospace;
}
html:has(#font-toggle:checked) pre,
html:has(#font-toggle:checked) code {
    font-family: "Menlo", "Monaco", "Courier New", monospace;
}

/* Math: TeX in the markdown, rendered to MathML by pandoc (--mathml), drawn by the
   browser. Termes is a Times-style math font, matching the prose. */
@font-face {
    font-family: "TeX Gyre Termes Math";
    src: url('../resources/style/texgyretermes-math.woff2') format('woff2');
}
math { font-family: "TeX Gyre Termes Math", math; }
/* Display equations are styled like code blocks: same panel, and they scroll
   sideways with the fade and "fit" button when too wide. */
.math-wrap { display: block; margin: 1em 0; background-color: #333; }
.math-scroll { display: block; overflow-x: auto; overflow-y: hidden; padding: 0.5rem; }
/* Tall fractions would run into the button, so make room above the equation while it shows. */
.math-wrap.overflows .math-scroll, .math-wrap.fitted .math-scroll { padding-top: 1.4rem; }

code span.dt { color: #e4a51e; } /* DataType */

pre {
    padding: 0;
    line-height: 1.25;
    overflow-x: visible;
    background-color: transparent;
}

pre code {
    /* Matches .sourceCode blocks, set in blog/generate.py. */
    font-size: 17px;
    display: block;
    min-width: max-content;
    padding: .5rem;
    background-color: #333;
}
blockquote {
    border-left: 3px solid #01ff70;
    padding-left: 1rem;
}

/* More dramatic mobile scaling */
@media (max-width: 600px) {
    html h1, html .retro-h1 {
        font-size: 250%;
    }
    html h2, html .retro-h2 {
        font-size: 180%;
    }
    html h3, html .retro-h3 {
        font-size: 140%;
    }
    html h4, html .retro-h4 {
        font-size: 110%;
    }
}
</style>
<script>
/* Code block (and display equation) controls. Marks blocks whose lines overflow (.overflows shows the
   fade and the "fit" button), and implements "fit": shrink that block's font
   until its longest line fits the available width. Clicking again restores it.
   Exposed as initCodeBlocks() so password-protected pages can rerun it after
   swapping in the decrypted body. */
(function () {
    const wraps = () => document.querySelectorAll(".code-wrap");
    const box = (wrap) => wrap.lastElementChild;  // the scroll container: div.sourceCode, pre, or .math-scroll
    const code = (wrap) => wrap.querySelector("pre > code, math");
    const overflowing = (el) => el.scrollWidth > el.clientWidth + 1;

    function fit(wrap) {
        const b = box(wrap), c = code(wrap);
        c.style.fontSize = "";
        // Glyphs scale with font size but the padding doesn't, so a few passes converge.
        for (let i = 0; i < 8 && overflowing(b); i++) {
            const size = parseFloat(getComputedStyle(c).fontSize);
            c.style.fontSize = (size * b.clientWidth / b.scrollWidth - 0.1).toFixed(2) + "px";
        }
    }

    function update() {
        for (const wrap of wraps()) {
            if (wrap.classList.contains("fitted")) fit(wrap);
            wrap.classList.toggle("overflows", overflowing(box(wrap)));
        }
    }

    function init() {
        for (const wrap of wraps()) {
            const btn = wrap.querySelector(".fit-btn");
            if (!btn || btn.dataset.ready) continue;
            btn.dataset.ready = "1";
            btn.addEventListener("click", () => {
                if (wrap.classList.toggle("fitted")) fit(wrap);
                else code(wrap).style.fontSize = "";
                update();
            });
        }
        update();
    }

    window.initCodeBlocks = init;
    document.addEventListener("DOMContentLoaded", init);
    window.addEventListener("resize", update);
    // Widths change once lemon loads, and when the "font" toggle swaps typefaces.
    document.fonts.ready.then(update);
    document.addEventListener("change", (e) => {
        if (e.target.id === "font-toggle") requestAnimationFrame(update);
    });
})();
</script>
