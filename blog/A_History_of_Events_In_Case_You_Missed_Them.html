<html>
<head>

<style>
    html {
      line-height: 1.5;
      font-family: Georgia, serif;
      font-size: 20px;
      color: #1a1a1a;
      background-color: #fdfdfd;
    }
    body {
      margin: 0 auto;
      max-width: 36em;
      padding-left: 50px;
      padding-right: 50px;
      padding-top: 50px;
      padding-bottom: 50px;
      hyphens: auto;
      overflow-wrap: break-word;
      text-rendering: optimizeLegibility;
      font-kerning: normal;
    }
    @media (max-width: 600px) {
      body {
        font-size: 0.9em;
        padding: 1em;
      }
      h1 {
        font-size: 1.8em;
      }
    }
    @media print {
      body {
        background-color: transparent;
        color: black;
        font-size: 12pt;
      }
      p, h2, h3 {
        orphans: 3;
        widows: 3;
      }
      h2, h3, h4 {
        page-break-after: avoid;
      }
    }
    p {
      margin: 1em 0;
    }
    a {
      color: #1a1a1a;
    }
    a:visited {
      color: #1a1a1a;
    }
    img {
      max-width: 100%;
    }
    h1, h2, h3, h4, h5, h6 {
      margin-top: 1.4em;
    }
    h5, h6 {
      font-size: 1em;
      font-style: italic;
    }
    h6 {
      font-weight: normal;
    }
    ol, ul {
      padding-left: 1.7em;
      margin-top: 1em;
    }
    li > ol, li > ul {
      margin-top: 0;
    }
    blockquote {
      margin: 1em 0 1em 1.7em;
      padding-left: 1em;
      border-left: 2px solid #e6e6e6;
      color: #606060;
    }
    code {
      font-family: Menlo, Monaco, 'Lucida Console', Consolas, monospace;
      font-size: 85%;
      margin: 0;
    }
    pre {
      margin: 1em 0;
      overflow: auto;
    }
    pre code {
      padding: 0;
      overflow: visible;
      overflow-wrap: normal;
    }
    .sourceCode {
      font-size: 20px;
    }
    hr {
      background-color: #1a1a1a;
      border: none;
      height: 1px;
      margin: 1em 0;
    }
    table {
      margin: 1em 0;
      border-collapse: collapse;
      width: 100%;
      overflow-x: auto;
      display: block;
      font-variant-numeric: lining-nums tabular-nums;
    }
    table caption {
      margin-bottom: 0.75em;
    }
    tbody {
      margin-top: 0.5em;
      border-top: 1px solid #1a1a1a;
      border-bottom: 1px solid #1a1a1a;
    }
    th {
      border-top: 1px solid #1a1a1a;
      padding: 0.25em 0.5em 0.25em 0.5em;
    }
    td {
      padding: 0.125em 0.5em 0.25em 0.5em;
    }
    header {
      margin-bottom: 4em;
      text-align: center;
    }
    #TOC li {
      list-style: none;
    }
    #TOC ul {
      padding-left: 1.3em;
    }
    #TOC > ul {
      padding-left: 0;
    }
    #TOC a:not(:hover) {
      text-decoration: none;
    }
    code{white-space: pre-wrap;}
    span.smallcaps{font-variant: small-caps;}
    span.underline{text-decoration: underline;}
    div.column{display: inline-block; vertical-align: top; width: 50%;}
    div.hanging-indent{margin-left: 1.5em; text-indent: -1.5em;}
    ul.task-list{list-style: none;}
    .display.math{display: block; text-align: center; margin: 0.5rem auto;}

  #font-toggle { display: none; }
  /* The label is anchored to .code-wrap, which does NOT scroll, while the

      position: absolute;
      top: 0.3rem;
      right: 0.3rem;
      cursor: pointer;
      color: #666;

      border: 1px solid #555;
      font-family: "lemon", "Menlo", "Monaco", "Courier New";

      background: #2a2a2a;

      }

        const authTagB64 = '7dMRGoFBG8Z1PnAsKODw6V51coij0qmAB/qyDPau6TE=';

        function togglePassword() {
            const passwordField = document.getElementById('password-field');
            const showPassword = document.getElementById('show-password');
            passwordField.type = showPassword.checked ? 'text' : 'password';
        }

        function checkPassword() {
            const passwordInput = document.getElementById('password-field').value;
            const errorMsg = document.getElementById('error-msg');

            // Show decrypting message
            errorMsg.textContent = 'Decrypting...';
            errorMsg.style.color = '#666';

            // Use setTimeout to let the UI update before the heavy computation
            setTimeout(() => {
                try {
                // Convert base64 to CryptoJS format
                const salt = CryptoJS.enc.Base64.parse(saltB64);
                const iv = CryptoJS.enc.Base64.parse(ivB64);
                const ciphertext = CryptoJS.enc.Base64.parse(ciphertextB64);
                const authTag = CryptoJS.enc.Base64.parse(authTagB64);

                // Derive key from password using PBKDF2 (64 bytes: 32 for AES, 32 for HMAC)
                const derivedKey = CryptoJS.PBKDF2(passwordInput, salt, {
                    keySize: 512/32,  // 64 bytes = 512 bits
                    iterations: 100000,
                    hasher: CryptoJS.algo.SHA256
                });

                // Split into encryption key and HMAC key
                const encryptionKey = CryptoJS.lib.WordArray.create(derivedKey.words.slice(0, 8));  // First 32 bytes
                const hmacKey = CryptoJS.lib.WordArray.create(derivedKey.words.slice(8, 16));  // Last 32 bytes

                // Verify HMAC
                const computedTag = CryptoJS.HmacSHA256(ciphertext, hmacKey);
                if (computedTag.toString() !== authTag.toString()) {
                    throw new Error('Authentication failed');
                }

                // Decrypt with AES-CBC
                const decrypted = CryptoJS.AES.decrypt(
                    { ciphertext: ciphertext },
                    encryptionKey,
                    {
                        iv: iv,
                        mode: CryptoJS.mode.CBC,
                        padding: CryptoJS.pad.Pkcs7
                    }
                );

                // Convert to UTF-8 string
                const decryptedContent = decrypted.toString(CryptoJS.enc.Utf8);

                if (!decryptedContent) {
                    throw new Error('Decryption produced empty result');
                }

                    // Replace body content with decrypted content
                    document.body.innerHTML = decryptedContent;
                } catch (e) {
                    console.error('Decryption error:', e);
                    errorMsg.style.color = 'red';
                    errorMsg.textContent = 'Incorrect password';
                }
            }, 10);
        }

        // Allow Enter key to submit
        document.getElementById('password-field').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
